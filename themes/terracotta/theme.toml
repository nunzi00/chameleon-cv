# Tema «terracotta» de Chameleon CV (T-8.16): estilo sobre la organización cronológica (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from terracotta`) y genera con `--theme mio`.

[theme]
name = "terracotta"
description = "Acento cálido de tierra cocida en el nombre, los títulos y las viñetas, sobre un gris cálido: cercano sin perder formalidad"
version = 1
kind = "style"          # estilo sobre la organización cronológica (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#2b211c"
primary = "#9c4a2f"
secondary = "#7a6a60"
accent = "#9c4a2f"
rule = "#e4d5cb"

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst (Libertinus Serif, DejaVu Sans Mono)
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 26
headline = 11.2
contact = 9.3
section = 8.8
title = 11
meta = 9.3
body = 10.2
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.57
paragraph = 0.72
list = 0.45

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 18
right = 20
bottom = 16
left = 20
