# Tema «gazette» de Chameleon CV (T-8.16): estilo sobre la organización cronológica (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from gazette`) y genera con `--theme mio`.

[theme]
name = "gazette"
description = "Aire de prensa clásica: nombre entre dos filetes, antetítulo centrado y secciones con doble regla fina; serif en los títulos y sans en el cuerpo"
version = 1
kind = "style"          # estilo sobre la organización cronológica (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#1a1a1a"
primary = "#1a1a1a"
secondary = "#5e5e5e"
accent = "#8a1c1c"
rule = "#c9c9c9"

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst (Libertinus Serif, DejaVu Sans Mono)
body = "Source Sans 3"
heading = "Libertinus Serif"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 30
headline = 10.6
contact = 9
section = 9
title = 11
meta = 9
body = 10
footer = 8.4
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.55
paragraph = 0.7
list = 0.42

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 17
right = 20
bottom = 15
left = 20
