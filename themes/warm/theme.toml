# Tema «warm» de Chameleon CV (T-8.12): estilo sobre la organización cronológica (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from warm`) y genera con `--theme mio`.

[theme]
name = "warm"
description = "Paleta cálida (terracota, ocre y crema): cabecera sobre un panel crema, títulos como etiquetas redondeadas y periodos en pastilla; cercano y legible"
version = 1
kind = "style"          # estilo sobre la organización cronológica (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#2b1f1a"       # cuerpo de texto
primary = "#8c3b2f"    # nombre y títulos
secondary = "#7a5c52"  # metadatos, fechas, etiquetas de sección, ubicación e impacto
accent = "#b5651d"     # enlaces y acentos
rule = "#eddccf"       # reglas, filetes y fondos suaves

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst (Libertinus Serif, DejaVu Sans Mono)
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 25
headline = 11.5
contact = 9.3
section = 9.6
title = 10.8
meta = 9.2
body = 10
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.56
paragraph = 0.7
list = 0.45

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 15
right = 18
bottom = 16
left = 18
