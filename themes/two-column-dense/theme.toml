# Tema «two-column-dense» de Chameleon CV (T-8.16): organización propia (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from two-column-dense`) y genera con `--theme mio`.

[theme]
name = "two-column-dense"
description = "Dos columnas equilibradas de arriba abajo: la organización más densa del catálogo, pensada para trayectorias largas que deben caber en una o dos páginas"
version = 1
kind = "organization"   # organización: cambia el orden y la maquetación del contenido (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#17191c"
primary = "#17191c"
secondary = "#61666d"
accent = "#0f5c4a"
rule = "#d8dbdf"

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst (Libertinus Serif, DejaVu Sans Mono)
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 22
headline = 10.2
contact = 8.4
section = 8.2
title = 9.8
meta = 8.4
body = 9.2
footer = 8
code = 8.6

[spacing]              # en «em» del cuerpo
leading = 0.55
paragraph = 0.7
list = 0.42

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 15
right = 15
bottom = 14
left = 15
