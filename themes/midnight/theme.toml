# Tema «midnight» de Chameleon CV (T-8.16): estilo sobre la organización cronológica (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from midnight`) y genera con `--theme mio`.

[theme]
name = "midnight"
description = "Azules profundos sobre papel claro, con el nombre y los títulos en azul noche y las secciones subrayadas por un filete grueso: pensado para leerse en pantalla"
version = 1
kind = "style"          # estilo sobre la organización cronológica (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#151d2b"
primary = "#16305c"
secondary = "#54607a"
accent = "#1d4ed8"
rule = "#c7d2e3"

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst (Libertinus Serif, DejaVu Sans Mono)
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 27
headline = 11.4
contact = 9.3
section = 8.8
title = 11
meta = 9.3
body = 10.2
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.56
paragraph = 0.72
list = 0.44

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 18
right = 19
bottom = 16
left = 19
