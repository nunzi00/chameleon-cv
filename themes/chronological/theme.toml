# Tema «chronological» de Chameleon CV (T-8.12): organización del contenido (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from chronological`) y genera con `--theme mio`.

[theme]
name = "chronological"
description = "Cronológica inversa con la fecha como eje: el periodo en una columna fija a la izquierda de cada entrada; después habilidades, logros e idiomas"
version = 1
kind = "organization"   # orden y agrupación de las secciones (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#1b1b1b"       # cuerpo de texto
primary = "#1b1b1b"    # nombre y títulos de entrada
secondary = "#575757"  # metadatos, fechas, etiquetas de sección, ubicación e impacto
accent = "#1f4e79"     # enlaces
rule = "#c9c9c9"       # reglas, filetes y fondos suaves

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 24
headline = 11.5
contact = 9.3
section = 9.4
title = 10.8
meta = 9.3
body = 10
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.55         # interlineado
paragraph = 0.7        # separación entre párrafos
list = 0.45            # separación entre viñetas

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 17
right = 19
bottom = 16
left = 19

[layout]                # la organización, para las salidas que no ejecutan el template.typ (T-9.26)
sections = ["experience", "education", "certifications", "projects", "skills", "achievements", "languages"]
