# Tema «education-first» de Chameleon CV (T-8.12): organización del contenido (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from education-first`) y genera con `--theme mio`.

[theme]
name = "education-first"
description = "La formación primero: formación y certificaciones abren el CV, después habilidades y proyectos y al final la experiencia completa; para recién titulados, prácticas y cambios de carrera"
version = 1
kind = "organization"   # orden y agrupación de las secciones (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#1f2933"       # cuerpo de texto
primary = "#0f4c5c"    # nombre y títulos
secondary = "#5b6b73"  # metadatos, fechas, etiquetas de sección, ubicación e impacto
accent = "#e36414"     # enlaces y acentos
rule = "#cfd8dc"       # reglas, filetes y fondos suaves

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst (Libertinus Serif, DejaVu Sans Mono)
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 24
headline = 11.5
contact = 9.3
section = 9.4
title = 10.8
meta = 9.3
body = 10
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.55
paragraph = 0.7
list = 0.45

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 17
right = 19
bottom = 16
left = 19

[layout]                # la organización, para las salidas que no ejecutan el template.typ (T-9.26)
sections = ["education", "certifications", "skills", "projects", "experience", "achievements", "languages"]
