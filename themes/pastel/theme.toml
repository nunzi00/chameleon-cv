# Tema «pastel» de Chameleon CV (T-8.12): estilo sobre la organización cronológica (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from pastel`) y genera con `--theme mio`.

[theme]
name = "pastel"
description = "Paleta pastel (lavanda, menta y crema): cabecera sobre un panel lavanda, títulos en cajas de color suave y periodos en pastilla menta; amable y actual"
version = 1
kind = "style"          # estilo sobre la organización cronológica (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#2e2e3a"       # cuerpo de texto
primary = "#4b4d8a"    # nombre y títulos
secondary = "#6b6b80"  # metadatos, fechas, etiquetas de sección, ubicación e impacto
accent = "#3f8f7d"     # enlaces y acentos
rule = "#e6e4f2"       # reglas, filetes y fondos suaves

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst (Libertinus Serif, DejaVu Sans Mono)
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 24
headline = 11.5
contact = 9.3
section = 9.4
title = 10.8
meta = 9.3
body = 10
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.55
paragraph = 0.7
list = 0.45

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 17
right = 19
bottom = 16
left = 19
