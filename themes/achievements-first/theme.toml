# Tema «achievements-first» de Chameleon CV (T-8.12): organización del contenido (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from achievements-first`) y genera con `--theme mio`.

[theme]
name = "achievements-first"
description = "El impacto primero: logros destacados y el primer logro de cada puesto (con la empresa) en un panel inicial; después la cronología corta, proyectos en una línea, habilidades y formación"
version = 1
kind = "organization"   # orden y agrupación de las secciones (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#1c1c1e"       # cuerpo de texto
primary = "#3a2f5b"    # nombre y títulos
secondary = "#5f5a73"  # metadatos, fechas, etiquetas de sección, ubicación e impacto
accent = "#c0392b"     # enlaces y acentos
rule = "#ddd8ea"       # reglas, filetes y fondos suaves

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst (Libertinus Serif, DejaVu Sans Mono)
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 24
headline = 11.5
contact = 9.3
section = 9.4
title = 10.8
meta = 9.3
body = 10
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.55
paragraph = 0.7
list = 0.45

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 17
right = 19
bottom = 16
left = 19
