# Tema «functional» de Chameleon CV (T-8.12): organización del contenido (véase la cabecera de template.typ).
# Copia este directorio a themes/<mi-tema>/ en tu proyecto (`cv theme create mio --from functional`) y genera con `--theme mio`.

[theme]
name = "functional"
description = "Funcional: competencias por especialidad y logros consolidados (con la empresa de origen) primero; proyectos y trayectoria en una línea por puesto al final"
version = 1
kind = "organization"   # orden y agrupación de las secciones (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#1f2933"       # cuerpo de texto
primary = "#2f3e46"    # nombre y títulos de entrada
secondary = "#5c6b73"  # metadatos, fechas, etiquetas de sección, ubicación e impacto
accent = "#2a6f97"     # enlaces
rule = "#c8d0d6"       # reglas, filetes y fondos suaves

[fonts]                # familias disponibles: Source Sans 3 (templates/fonts) y las embebidas en Typst
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 24
headline = 11.5
contact = 9.3
section = 9.4
title = 10.8
meta = 9.3
body = 10
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.55         # interlineado
paragraph = 0.7        # separación entre párrafos
list = 0.45            # separación entre viñetas

[page]
paper = "a4"           # a4, a5, a3, us-letter, us-legal

[page.margins]         # en milímetros
top = 17
right = 19
bottom = 16
left = 19

[layout]                # la organización, para las salidas que no ejecutan el template.typ (T-9.26)
sections = ["skills", "achievements", "projects", "experience", "education", "certifications", "languages"]
achievements = "consolidated"  # los logros se consolidan fuera de su entrada, con la empresa de origen
experience = "compact"      # una línea por puesto: sin resumen ni logros
