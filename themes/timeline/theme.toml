# Tema «timeline» de Chameleon CV (T-8.7): línea de tiempo —el periodo a la izquierda sobre un raíl con un punto por
# entrada, el contenido a la derecha— para trayectorias progresivas (mandos intermedios, gestión de proyectos,
# consultoría, operaciones, ventas). Una sola columna con raíl gráfico (formas, no texto): el orden de extracción es
# periodo → título → logros, como en «academic». Sin fuentes nuevas.

[theme]
name = "timeline"
description = "Línea de tiempo: periodos a la izquierda sobre un raíl con puntos, contenido a la derecha; pensado para trayectorias progresivas"
version = 1
kind = "style"          # estilo sobre la organización cronológica (T-8.12)
author = "Chameleon CV"
license = "MIT"
homepage = "https://nunzi00.github.io/chameleon-cv/guide/theme-gallery"

[colors]
text = "#1f2937"       # cuerpo de texto
primary = "#111827"    # nombre y títulos
secondary = "#6b7280"  # ubicación, impacto, metadatos
accent = "#0f766e"     # verde azulado: periodos, puntos del raíl, enlaces, filete de la cabecera
rule = "#cbd5e1"       # raíl y filetes

[fonts]
body = "Source Sans 3"
heading = "Source Sans 3"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 24
headline = 11
contact = 9.2
section = 9.8
title = 10.8
meta = 9.2
body = 10
footer = 8.5
code = 9

[spacing]              # en «em» del cuerpo
leading = 0.55
paragraph = 0.7
list = 0.42

[page]
paper = "a4"

[page.margins]         # en milímetros
top = 16
right = 18
bottom = 16
left = 16
