# Release (T-6.3, docs/packaging-and-release.md §6): un tag «vX.Y.Z» dispara verify → package-linux-x64 →
# release. «workflow_dispatch» ensaya el empaquetado y los arneses contra el binario sin publicar nada.
# Permisos mínimos por trabajo, acciones fijadas por SHA, sin secretos (basta el GITHUB_TOKEN).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TYPST_VERSION: '0.15.1'

jobs:
  verify:
    name: Verificar (typecheck, cobertura 100 %, aceptación; tag = versión)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: El tag debe ser la versión de package.json (vX.Y.Z; «-rc.N» = prerelease)
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::el tag $GITHUB_REF_NAME no coincide con la versión $version de package.json"
            exit 1
          fi
      - run: npm ci
      - name: CHANGELOG.md debe tener la sección de la versión, con fecha y contenido (notas de la release)
        run: npm run --silent release:notes -- "$(node -p "require('./package.json').version")" > /dev/null
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chameleon-cv/typst
          key: typst-${{ env.TYPST_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Typst ${{ env.TYPST_VERSION }}
        run: |
          node dist/index.js typst install
          echo "CHAMELEON_TYPST=$HOME/.cache/chameleon-cv/typst/$TYPST_VERSION/typst" >> "$GITHUB_ENV"
      - run: npm run coverage
      - name: Arnés de aceptación determinista (Typst obligatorio)
        run: |
          set -o pipefail
          npm run test:acceptance:deterministic -- --require-typst 2>&1 | tee arnes.log
      - name: Diagnóstico del arnés (anotaciones y resumen del trabajo; solo si falló)
        if: failure()
        run: |
          { echo '## Arnés de aceptación determinista'; echo '```'; tail -c 60000 arnes.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E '✗|esperados|^ {4,}[-+] ' arnes.log | head -10 | while IFS= read -r line; do printf '::error title=Arnés de aceptación::%s\n' "$line"; done

  package-linux-x64:
    name: Empaquetar linux-x64 y aceptar el binario
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chameleon-cv/typst
          key: typst-${{ env.TYPST_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Typst ${{ env.TYPST_VERSION }}
        run: |
          node dist/index.js typst install
          echo "CHAMELEON_TYPST=$HOME/.cache/chameleon-cv/typst/$TYPST_VERSION/typst" >> "$GITHUB_ENV"
      - name: npm run package (compilación limpia, bundles, manifiesto, node --build-sea, prueba de humo, tar.gz + sha256)
        run: npm run package
      - name: Arnés de aceptación determinista contra el ejecutable (77 pasos, byte a byte)
        run: npm run test:acceptance:deterministic -- --binary build/sea/cv --require-typst
      - name: Notas de la release desde CHANGELOG.md (viajan con el artefacto)
        run: npm run --silent release:notes -- "$(node -p "require('./package.json').version")" > build/release/RELEASE-NOTES.md
      - name: Archivar el artefacto de lanzamiento
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chameleon-cv-linux-x64
          path: |
            build/release/*.tar.gz
            build/release/*.sha256
            build/release/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar la release en GitHub
    if: github.ref_type == 'tag'
    needs: package-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chameleon-cv-*
          path: assets
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Atestación de procedencia (SLSA, verificable con «gh attestation verify»)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.tar.gz
      - name: Release de GitHub con los archivos, sus sha256, SHA256SUMS.txt y las notas de CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file assets/RELEASE-NOTES.md --title "Chameleon CV $GITHUB_REF_NAME" $prerelease assets/*.tar.gz assets/*.sha256 assets/SHA256SUMS.txt
