# Release (T-6.3, docs/packaging-and-release.md §6; imagen en GHCR en T-7.3, docs/ghcr-publication.md §3.4):
# un tag «vX.Y.Z» dispara verify → package-linux-x64 → release, y en paralelo docker-build (por arquitectura,
# humo antes de empujar por digest) → docker-publish (índice multi-arquitectura, etiquetas, atestación).
# «workflow_dispatch» sin entradas ensaya todo sin publicar nada; con «tag» (una release existente) y «push»
# publica la imagen de esa versión. Permisos mínimos por trabajo, acciones fijadas por SHA, sin secretos.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release ya publicada cuya imagen se (re)construye (p. ej. v1.1.1); vacío = la rama actual, solo ensayo'
        required: false
        default: ''
      push:
        description: 'Publicar la imagen en GHCR (exige que «tag» sea una release existente)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TYPST_VERSION: '0.15.1'
  IMAGE: ghcr.io/${{ github.repository }}
  # Versión que se libera: el tag empujado o el indicado a mano; en un ensayo sin tag, el nombre de la rama.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.ref_type == 'tag' || inputs.push == true }}

jobs:
  verify:
    name: Verificar (typecheck, cobertura 100 %, aceptación; tag = versión)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: El tag debe ser la versión de package.json (vX.Y.Z; «-rc.N» = prerelease)
        if: github.ref_type == 'tag' || inputs.tag != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::el tag $RELEASE_TAG no coincide con la versión $version de package.json"
            exit 1
          fi
      - run: npm ci
      - run: npm ci --prefix gui
      - name: CHANGELOG.md debe tener la sección de la versión, con fecha y contenido (notas de la release)
        run: npm run --silent release:notes -- "$(node -p "require('./package.json').version")" > /dev/null
      - run: npm run typecheck
      - run: npm run build
      - run: npm run gui:build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chameleon-cv/typst
          key: typst-${{ env.TYPST_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Typst ${{ env.TYPST_VERSION }}
        run: |
          node dist/index.js typst install
          echo "CHAMELEON_TYPST=$HOME/.cache/chameleon-cv/typst/$TYPST_VERSION/typst" >> "$GITHUB_ENV"
      - run: npm run coverage
      - name: Arnés de aceptación determinista (Typst obligatorio)
        run: |
          set -o pipefail
          npm run test:acceptance:deterministic -- --require-typst 2>&1 | tee arnes.log
      - name: Diagnóstico del arnés (anotaciones y resumen del trabajo; solo si falló)
        if: failure()
        run: |
          { echo '## Arnés de aceptación determinista'; echo '```'; tail -c 60000 arnes.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E '✗|esperados|^ {4,}[-+] ' arnes.log | head -10 | while IFS= read -r line; do printf '::error title=Arnés de aceptación::%s\n' "$line"; done

  package-linux-x64:
    name: Empaquetar linux-x64 y aceptar el binario
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix gui
      - run: npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chameleon-cv/typst
          key: typst-${{ env.TYPST_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Typst ${{ env.TYPST_VERSION }}
        run: |
          node dist/index.js typst install
          echo "CHAMELEON_TYPST=$HOME/.cache/chameleon-cv/typst/$TYPST_VERSION/typst" >> "$GITHUB_ENV"
      - name: npm run package (compilación limpia, bundles, manifiesto, node --build-sea, prueba de humo, tar.gz + sha256)
        run: npm run package
      - name: Arnés de aceptación determinista contra el ejecutable (byte a byte, interfaz web incluida)
        run: npm run test:acceptance:deterministic -- --binary build/sea/cv --require-typst
      - name: Chromium de Playwright (caché por versión)
        id: playwright
        run: echo "version=$(node -p "require('./gui/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ runner.os }}
      - run: npx --prefix gui playwright install --with-deps chromium
      - name: E2E de la interfaz web con Playwright contra el ejecutable empaquetado
        run: CV_BINARY=build/sea/cv npm run gui:e2e
      - name: Notas de la release desde CHANGELOG.md (viajan con el artefacto)
        run: npm run --silent release:notes -- "$(node -p "require('./package.json').version")" > build/release/RELEASE-NOTES.md
      - name: Archivar el artefacto de lanzamiento
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chameleon-cv-linux-x64
          path: |
            build/release/*.tar.gz
            build/release/*.sha256
            build/release/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar la release en GitHub
    if: github.ref_type == 'tag'
    needs: package-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chameleon-cv-*
          path: assets
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Atestación de procedencia (SLSA, verificable con «gh attestation verify»)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.tar.gz
      - name: Release de GitHub con los archivos, sus sha256, SHA256SUMS.txt y las notas de CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file assets/RELEASE-NOTES.md --title "Chameleon CV $GITHUB_REF_NAME" $prerelease assets/*.tar.gz assets/*.sha256 assets/SHA256SUMS.txt

  docker-build:
    name: Imagen ${{ matrix.arch }} (construcción, humo de las dos variantes y empuje por digest)
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write # informe SARIF de Trivy (informativo; solo amd64)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Versión de package.json (la imagen publicada corre siempre como UID/GID 1000)
        run: echo "CV_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sesión en GHCR (solo al publicar)
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas OCI (created, version, revision…; las etiquetas de imagen las pone docker-publish)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
      - name: Construcción de la imagen Debian (la etapa build ejecuta npm run package)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: chameleon-cv:runtime
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UID=1000
            GID=1000
            VERSION=${{ env.CV_VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Construcción de la variante distroless (comparte la etapa build)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime-distroless
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: chameleon-cv:runtime-distroless
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.CV_VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Prueba de humo de la imagen Debian tal como se publica (usuario 1000)
        run: bash scripts/docker-smoke.sh chameleon-cv:runtime 1000
      - name: Prueba de humo de la variante distroless (--user 1000:1000)
        run: bash scripts/docker-smoke.sh chameleon-cv:runtime-distroless 1000 1000:1000
      - name: Análisis de vulnerabilidades de la imagen Debian (Trivy; informativo, nunca bloquea)
        if: matrix.arch == 'amd64'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chameleon-cv:runtime
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Informe SARIF a Code scanning (informativo)
        if: matrix.arch == 'amd64' && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy-release-${{ env.RELEASE_TAG }}
      - name: Empuje por digest de la imagen Debian (SBOM y procedencia de BuildKit; solo al publicar)
        if: env.PUBLISH == 'true'
        id: push_runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UID=1000
            GID=1000
            VERSION=${{ env.CV_VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Empuje por digest de la variante distroless (solo al publicar)
        if: env.PUBLISH == 'true'
        id: push_distroless
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime-distroless
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.CV_VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Digests de esta arquitectura (los une docker-publish)
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests/runtime digests/runtime-distroless
          touch "digests/runtime/${RUNTIME_DIGEST#sha256:}" "digests/runtime-distroless/${DISTROLESS_DIGEST#sha256:}"
          ls -R digests
        env:
          RUNTIME_DIGEST: ${{ steps.push_runtime.outputs.digest }}
          DISTROLESS_DIGEST: ${{ steps.push_distroless.outputs.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publicar la imagen en GHCR (índice multi-arquitectura, etiquetas y atestación)
    needs: [docker-build, release]
    # Con un tag, solo tras la release de GitHub; a mano, solo con push=true. always() permite evaluar aunque release se omita.
    if: always() && needs.docker-build.result == 'success' && ((github.ref_type == 'tag' && needs.release.result == 'success') || (github.ref_type != 'tag' && inputs.push == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: La imagen solo se publica para una release existente y no borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft --jq 'if .isDraft then error("la release es un borrador") else .tagName end'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas de la imagen Debian (X.Y.Z, X.Y, X y latest; sin alias en prereleases)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
      - name: Etiquetas de la variante distroless (sufijo -distroless)
        id: meta_distroless
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
            suffix=-distroless,onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
      - name: Índices multi-arquitectura con sus etiquetas (una por arquitectura empujada)
        run: |
          create() { # $1 = JSON de metadata-action, $2 = directorio de digests
            docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$1") $(for d in "$2"/*; do printf '%s@sha256:%s ' "$IMAGE" "$(basename "$d")"; done)
          }
          create "$META_RUNTIME" digests/runtime
          create "$META_DISTROLESS" digests/runtime-distroless
        env:
          META_RUNTIME: ${{ steps.meta.outputs.json }}
          META_DISTROLESS: ${{ steps.meta_distroless.outputs.json }}
      - name: Digest de cada índice (el sujeto de la atestación)
        run: |
          runtime_tag="$(jq -r '.tags[0]' <<< "$META_RUNTIME")"
          distroless_tag="$(jq -r '.tags[0]' <<< "$META_DISTROLESS")"
          echo "DIGEST_RUNTIME=$(docker buildx imagetools inspect "$runtime_tag" --format '{{ .Manifest.Digest }}')" >> "$GITHUB_ENV"
          echo "DIGEST_DISTROLESS=$(docker buildx imagetools inspect "$distroless_tag" --format '{{ .Manifest.Digest }}')" >> "$GITHUB_ENV"
          echo "RUNTIME_TAG=$runtime_tag" >> "$GITHUB_ENV"
          docker buildx imagetools inspect "$runtime_tag"
        env:
          META_RUNTIME: ${{ steps.meta.outputs.json }}
          META_DISTROLESS: ${{ steps.meta_distroless.outputs.json }}
      - name: Atestación de procedencia de la imagen Debian (Sigstore; también en el registro)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST_RUNTIME }}
          push-to-registry: true
      - name: Atestación de procedencia de la variante distroless
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST_DISTROLESS }}
          push-to-registry: true
      - name: Resumen (cómo descargar y verificar)
        run: |
          {
            echo "## Imagen publicada"
            echo
            echo '```'
            echo "docker pull $RUNTIME_TAG"
            echo "gh attestation verify oci://$RUNTIME_TAG --owner ${GITHUB_REPOSITORY_OWNER}"
            echo "docker buildx imagetools inspect $RUNTIME_TAG --format '{{ json .SBOM }}'"
            echo '```'
            echo
            echo "Digest Debian: \`$DIGEST_RUNTIME\` · digest distroless: \`$DIGEST_DISTROLESS\`"
          } >> "$GITHUB_STEP_SUMMARY"
