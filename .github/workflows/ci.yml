# Integración continua (T-6.3): en cada push a main y en cada pull request, exactamente lo que el
# trabajo «verify» del release exige: typecheck, cobertura al 100 %, suite con Typst real y el
# arnés de aceptación determinista completo (con Typst obligatorio). Sin secretos, permisos mínimos,
# acciones fijadas por SHA (el comentario indica la versión) — docs/packaging-and-release.md §6.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TYPST_VERSION: '0.15.1'

jobs:
  verify:
    name: Verificar (typecheck, cobertura 100 %, aceptación determinista)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Caché del binario de Typst (se descarga, verificado por SHA-256, solo si falta)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chameleon-cv/typst
          key: typst-${{ env.TYPST_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Typst ${{ env.TYPST_VERSION }} (cv typst install, única operación de red del producto)
        run: |
          node dist/index.js typst install
          echo "CHAMELEON_TYPST=$HOME/.cache/chameleon-cv/typst/$TYPST_VERSION/typst" >> "$GITHUB_ENV"
      - name: Suite unitaria con cobertura (incluye las pruebas con el binario real de Typst)
        run: npm run coverage
      - name: Arnés de aceptación determinista (Typst obligatorio)
        run: |
          set -o pipefail
          npm run test:acceptance:deterministic -- --require-typst 2>&1 | tee arnes.log
      - name: Diagnóstico del arnés (anotaciones y resumen del trabajo; solo si falló)
        if: failure()
        run: |
          { echo '## Arnés de aceptación determinista'; echo '```'; tail -c 60000 arnes.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E '✗|esperados|^ {4,}[-+] ' arnes.log | head -10 | while IFS= read -r line; do printf '::error title=Arnés de aceptación::%s\n' "$line"; done

  docker:
    name: Imagen Docker ${{ matrix.arch }} (construcción, humo de las dos variantes, Compose y tutorial 5)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CHAMELEON_CV_IMAGE: chameleon-cv:local   # la que usan los ficheros de Compose (tutorial 5) en lugar de la publicada
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: UID y GID del runner (los ficheros del volumen deben ser suyos) y versión
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "CV_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Construcción de la imagen Debian (la etapa build ejecuta npm run package; caché de capas en Actions por arquitectura)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: chameleon-cv:local
          build-args: |
            UID=${{ env.HOST_UID }}
            GID=${{ env.HOST_GID }}
            VERSION=${{ env.CV_VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Construcción de la variante distroless (comparte la etapa build)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime-distroless
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: chameleon-cv:local-distroless
          build-args: |
            VERSION=${{ env.CV_VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Prueba de humo de la imagen Debian (volumen, usuario sin privilegios, Typst, stdin, endurecida, red compartida)
        run: bash scripts/docker-smoke.sh chameleon-cv:local
      - name: Prueba de humo de la variante distroless (con --user, su usuario fijo no es el del runner)
        run: bash scripts/docker-smoke.sh chameleon-cv:local-distroless "$(id -u)" "$(id -u):$(id -g)"
      - name: Ficheros de Compose válidos (base, IA, GPU y las superposiciones de cv serve)
        run: |
          docker compose -f compose.yml config -q
          docker compose -f compose.yml -f compose.ai.yml config -q
          docker compose -f compose.yml -f compose.ai.yml -f compose.gpu.yml config -q
          docker compose -f compose.yml -f compose.serve.yml config -q
          docker compose -f compose.yml -f compose.ai.yml -f compose.serve-ai.yml config -q
      - name: Tutorial 5 («Todo en un contenedor») ejecutado contra la imagen recién construida (canon C15)
        run: CHAMELEON_DOCS_DOCKER=1 npm run docs:tutorials -- --only docker

  gui:
    name: Interfaz web (svelte-check, pruebas con cobertura 100 % de la lógica, construcción)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix gui
      - run: npm run gui:check
      - run: npm run gui:build
      - name: Presupuesto del paquete inicial (≤ 30 KB gzip; el editor va en un chunk aparte)
        run: |
          size=$(gzip -9 -c gui/dist/assets/index-*.js | wc -c)
          echo "index: $size bytes gzip"
          [ "$size" -le 30720 ] || { echo "::error::el paquete inicial pesa $size bytes gzip (máximo 30720)"; exit 1; }
