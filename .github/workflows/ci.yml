# Integración continua (T-6.3): en cada push a main y en cada pull request, exactamente lo que el
# trabajo «verify» del release exige: typecheck, cobertura al 100 %, suite con Typst real y el
# arnés de aceptación determinista completo (con Typst obligatorio). Sin secretos, permisos mínimos,
# acciones fijadas por SHA (el comentario indica la versión) — docs/packaging-and-release.md §6.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TYPST_VERSION: '0.15.1'

jobs:
  verify:
    name: Verificar (typecheck, cobertura 100 %, aceptación determinista)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Caché del binario de Typst (se descarga, verificado por SHA-256, solo si falta)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chameleon-cv/typst
          key: typst-${{ env.TYPST_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Typst ${{ env.TYPST_VERSION }} (cv typst install, única operación de red del producto)
        run: |
          node dist/index.js typst install
          echo "CHAMELEON_TYPST=$HOME/.cache/chameleon-cv/typst/$TYPST_VERSION/typst" >> "$GITHUB_ENV"
      - name: Suite unitaria con cobertura (incluye las pruebas con el binario real de Typst)
        run: npm run coverage
      - name: Arnés de aceptación determinista (Typst obligatorio)
        run: npm run test:acceptance:deterministic -- --require-typst

  docker:
    name: Imagen Docker (construcción con prueba de humo del empaquetado, humo de la imagen, Compose y tutorial 5)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: UID y GID del runner (los ficheros del volumen deben ser suyos) y versión
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "CV_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Construcción de la imagen (la etapa build ejecuta npm run package; caché de capas en Actions)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          load: true
          tags: chameleon-cv:local
          build-args: |
            UID=${{ env.HOST_UID }}
            GID=${{ env.HOST_GID }}
            VERSION=${{ env.CV_VERSION }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo de la imagen (volumen, usuario sin privilegios, Typst, stdin, endurecida, red compartida)
        run: bash scripts/docker-smoke.sh chameleon-cv:local
      - name: Ficheros de Compose válidos (base, IA y GPU)
        run: |
          docker compose -f compose.yml config -q
          docker compose -f compose.yml -f compose.ai.yml config -q
          docker compose -f compose.yml -f compose.ai.yml -f compose.gpu.yml config -q
      - name: Tutorial 5 («Todo en un contenedor») ejecutado contra la imagen (canon C15)
        run: CHAMELEON_DOCS_DOCKER=1 npm run docs:tutorials -- --only docker
