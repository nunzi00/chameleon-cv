# Chameleon CV en Docker (T-7.2, docs/docker.md §4). Perfil base: sin IA y sin red.
#   docker compose run --rm chameleon-cv <orden>        # init, build, generate-cv -s backend, analyze-offer oferta.txt…
# Superposiciones: compose.ai.yml (modelo local con Ollama) y compose.gpu.yml (GPU NVIDIA para Ollama).
# Datos personales solo en ./my-profile (montado en /work) y en el volumen cv-cache; nada dentro de la imagen.
services:
  chameleon-cv:
    image: chameleon-cv:local              # T-7.3 publicará ghcr.io/nunzi00/chameleon-cv:<versión>
    build:
      context: .
      target: runtime
      args:
        UID: "${UID:-1000}"                # .env: UID=$(id -u) y GID=$(id -g) para que los ficheros de my-profile sean tuyos (Linux)
        GID: "${GID:-1000}"
        VERSION: "${CHAMELEON_CV_VERSION:-dev}"
        REVISION: "${CHAMELEON_CV_REVISION:-unknown}"
    network_mode: none
    working_dir: /work
    volumes:
      - ./my-profile:/work                 # crea el directorio antes (mkdir my-profile): si lo crea Docker, será de root
      - cv-cache:/home/cv/.cache           # assets materializados y caché de respuestas del co-piloto
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
volumes:
  cv-cache:
