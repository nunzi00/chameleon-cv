# Ajustes de `dot ia repo` para este repositorio.
#
# Lo lee ~/.dotfiles/scripts/ia/repo con la forma CLAVE=valor. No se ejecuta como
# script: sólo se leen las claves conocidas, así que no puede correr código.
# Documentación: ~/.dotfiles/docs/IA.md  (sección «Entorno de desarrollo por repositorio»)

# Nombre del grupo: da nombre al RAG, a la sesión de aichat y a la sesión de tmux
# (ia-cv). Sin esto se usaría el del directorio, que aquí ya es "cv".
IA_NAME=cv

# Qué se indexa en el RAG. Por defecto entrarían 1364 ficheros; acotando a lo que
# de verdad aporta contexto quedan ~790 y la indexación es bastante más rápida.
# Se deja fuera `txt` a propósito: en este repo son fixtures de los tests de
# aceptación (tests/acceptance/bench/expected/), 583 ficheros de 0-2 bytes con el
# código de salida o el stderr esperado. Puro ruido para una búsqueda semántica.
# Se añaden `typ` (temas de Typst) y `svelte`, que no están en el default.
IA_RAG_EXTS=ts,mts,md,typ,svelte,toml,json,yml

# Lo que queda de esa carpeta de fixtures con otras extensiones (.md, .json).
# dist/, build/, coverage/ y node_modules/ no hacen falta aquí: no están
# trackeados, así que `git ls-files` ya los deja fuera.
IA_RAG_EXCLUDE=^tests/acceptance/bench/expected/

# Modelos para este repo. Comentados = valen los generales (aichat toma el de
# ~/.config/aichat/config.yaml y opencode el de dot ia code).
#IA_MODEL=local:qwen3.5:4b
#IA_CODE_MODEL=qwen3-coder:30b
