# Tema «bench» del banco de pruebas de aceptación (T-5.5.1): deriva de classic con paleta verde y márgenes
# anchos. Sirve para validar la cascada --theme > cv.toml > default sobre un tema del proyecto.

[theme]
name = "mio"
description = "Tema del banco de pruebas: classic con paleta verde y márgenes anchos"
version = 1

[colors]
text = "#222222"
primary = "#0b3d2e"
secondary = "#5a5a5a"
accent = "#0b6e4f"
rule = "#7c9a8e"

[fonts]                # Libertinus Serif viene embebida en Typst: no hace falta añadir ficheros
body = "Libertinus Serif"
heading = "Libertinus Serif"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 22
headline = 11.5
contact = 9.5
section = 9.8
title = 11
meta = 9.5
body = 10.5
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.65
paragraph = 0.8
list = 0.5

[page]
paper = "a4"

[page.margins]         # en milímetros
top = 24
right = 24
bottom = 20
left = 24
