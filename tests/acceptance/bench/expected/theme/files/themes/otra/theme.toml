# Tema «comunidad» del banco de pruebas (T-8.3): generado por tests/acceptance/bench/generate.ts a partir de themes/bench.

[theme]
name = "otra"
author = "Banco de pruebas de Chameleon CV"
license = "MIT"
homepage = "https://example.org/temas/comunidad"
description = "Tema de la comunidad del banco de pruebas: bench con acento granate"
version = 1

[colors]
text = "#222222"
primary = "#0b3d2e"
secondary = "#5a5a5a"
accent = "#8a1c1c"
rule = "#7c9a8e"

[fonts]                # Libertinus Serif viene embebida en Typst: no hace falta añadir ficheros
body = "Libertinus Serif"
heading = "Libertinus Serif"
mono = "DejaVu Sans Mono"

[sizes]                # en puntos
name = 22
headline = 11.5
contact = 9.5
section = 9.8
title = 11
meta = 9.5
body = 10.5
footer = 8.5
code = 9.2

[spacing]              # en «em» del cuerpo
leading = 0.65
paragraph = 0.8
list = 0.5

[page]
paper = "a4"

[page.margins]         # en milímetros
top = 24
right = 24
bottom = 20
left = 24
