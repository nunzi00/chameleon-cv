<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="Flujo de datos: fuentes, parsers, artefacto, selección y renderizado">
