<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="Flujo del co-piloto: perfil filtrado, carga seudonimizada, proveedor, verificación por código, revisión y aplicación con marca">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#5c5c5c"/></marker>
    <style>.box{fill:#ffffff;stroke:#1f4e79;stroke-width:1.6;rx:8}.soft{fill:#eef4fa;stroke:#1f4e79;stroke-width:1.2;rx:8}.warn{fill:#fff7ea;stroke:#b4690e;stroke-width:1.4;rx:8}.s{fill:#5c5c5c;font-size:12px}.l{stroke:#5c5c5c;stroke-width:1.4;fill:none;marker-end:url(#arrow2)}.h{fill:#1f4e79;font-weight:600}.w{fill:#b4690e;font-weight:600}</style>
  </defs>
  <rect x="20" y="40" width="180" height="90" class="box"/><text x="110" y="66" text-anchor="middle" class="h">Perfil filtrado</text><text x="110" y="86" text-anchor="middle" class="s">artefacto + selección (-s, -f, límites)</text><text x="110" y="104" text-anchor="middle" class="s">solo los ítems que verás en el CV</text>
  <rect x="250" y="40" width="180" height="90" class="box"/><text x="340" y="66" text-anchor="middle" class="h">Carga útil mínima</text><text x="340" y="86" text-anchor="middle" class="s">texto del logro + contexto</text><text x="340" y="104" text-anchor="middle" class="s">[NOMBRE] · [EMPRESA-n] · sin PII</text>
  <rect x="480" y="20" width="200" height="130" class="warn"/><text x="580" y="46" text-anchor="middle" class="w">LlmProvider</text><text x="580" y="66" text-anchor="middle" class="s">local: ollama · openai-compatible</text><text x="580" y="84" text-anchor="middle" class="s">solo loopback</text><text x="580" y="106" text-anchor="middle" class="s">remoto: --provider explícito,</text><text x="580" y="124" text-anchor="middle" class="s">lista blanca, coste y confirmación</text>
  <rect x="730" y="40" width="210" height="90" class="box"/><text x="835" y="66" text-anchor="middle" class="h">Verificación por código</text><text x="835" y="86" text-anchor="middle" class="s">C2: ni cifras ni entidades añadidas u omitidas</text><text x="835" y="104" text-anchor="middle" class="s">diccionario cerrado (tags)</text>
  <rect x="480" y="180" width="200" height="60" class="soft"/><text x="580" y="204" text-anchor="middle" class="h">Fichero de revisión (0600)</text><text x="580" y="224" text-anchor="middle" class="s">original · propuestas · veredictos</text>
  <rect x="730" y="180" width="210" height="60" class="soft"/><text x="835" y="204" text-anchor="middle" class="h">cv improve apply [x]</text><text x="835" y="224" text-anchor="middle" class="s">huella · .bak · cambio mínimo</text>
  <rect x="20" y="180" width="410" height="60" class="soft"/><text x="225" y="204" text-anchor="middle" class="h">--show-payload --dry-run · --show-prompt · caché local</text><text x="225" y="224" text-anchor="middle" class="s">ves exactamente qué saldría antes de que salga; repetir es gratis e idéntico</text>
  <path d="M200 85H248" class="l"/><path d="M430 85H478" class="l"/><path d="M680 85H728" class="l"/>
  <path d="M835 130V178" class="l" stroke-dasharray="5 4"/><text x="870" y="160" class="s">solo con tu marca</text>
  <path d="M835 130C835 160 700 160 680 200" class="l"/>
  <path d="M728 210H682" class="l"/>
</svg>
